<div class="html-editor-widget">
    <div class="editor-toolbar"></div>
    <div 
        class="editor-content"
        id="{{ widget.attrs.id }}"
        {% for name, value in widget.attrs.items %}
            {% if value is not False %}
                {% if value is True %}
                    {{ name }}
                {% else %}
                    {{ name }}="{{ value }}"
                {% endif %}
            {% endif %}
        {% endfor %}
    >{{ widget.value|default:"" }}</div>
    <textarea 
        name="{{ widget.name }}"
        {% for name, value in widget.attrs.items %}
            {% if value is not False %}
                {% if value is True %}
                    {{ name }}
                {% else %}
                    {{ name }}="{{ value }}"
                {% endif %}
            {% endif %}
        {% endfor %}
        class="inl-s-224b51a7b4"
    >{{ widget.value|default:"" }}</textarea>
</div>
