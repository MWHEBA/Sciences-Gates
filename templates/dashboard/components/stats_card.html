<!-- Statistics Card Component -->
<!-- 
    Context variables:
    - label: string (max 50 chars) - metric description
    - value: string/int (max 7 digits or 10 chars) - metric value
    - icon_svg: string (optional) - SVG path for icon
    - color: string (optional) - CSS variable name for category border/icon bg (e.g., 'primary', 'success', 'danger')
-->

<div class="bg-white rounded-lg shadow-sm p-6 h-full flex flex-col
    {% if color %}border-r-4{% endif %}"
    {% if color %}style="border-right-color: var(--{{ color }});"{% endif %}
>
    <!-- Content wrapper with flex layout for RTL icon alignment -->
    <div class="flex items-start justify-between gap-4">
        <!-- Text content (label + value) -->
        <div class="flex-1">
            <!-- Label -->
            <p class="text-sm text-text-muted mb-2 truncate" title="{{ label }}">
                {{ label }}
            </p>
            
            <!-- Value -->
            <p class="text-3xl font-semibold text-text-primary truncate" title="{{ value }}">
                {{ value }}
            </p>
        </div>
        
        <!-- Icon (optional, aligned opposite to text in RTL) -->
        {% if icon_svg %}
        <div class="flex-shrink-0 w-10 h-10 rounded-full flex items-center justify-center text-white"
            {% if color %}style="background-color: var(--{{ color }});"{% else %}style="background-color: var(--primary);"{% endif %}
        >
            {{ icon_svg|safe }}
        </div>
        {% endif %}
    </div>
</div>
