<!-- رسائل النظام - Django Messages Framework -->
<style>
.django-msg-toast {
    min-width: 320px;
    max-width: 420px;
    background-color: var(--surface);
    border-radius: var(--radius-xl);
    padding: 16px;
    position: relative;
    overflow: hidden;
    box-shadow: var(--shadow-lg);
    border: 1px solid var(--border);
    transition: all 0.5s ease;
}
.django-msg-toast[data-level="success"] {
    background-color: var(--success-light);
    border-color: rgba(12, 122, 67, 0.2);
    color: var(--success);
}
.django-msg-toast[data-level="error"] {
    background-color: var(--danger-light);
    border-color: rgba(214, 69, 69, 0.2);
    color: var(--danger);
}
.django-msg-toast[data-level="warning"] {
    background-color: var(--warning-light);
    border-color: rgba(216, 144, 0, 0.2);
    color: var(--warning);
}
.django-msg-toast[data-level="info"] {
    background-color: var(--info-light);
    border-color: rgba(35, 104, 181, 0.2);
    color: var(--info);
}
</style>

<div x-data="{ 
         toasts: [],
         addToast(message, level, undoEvent = null, undoData = null) {
             const id = Date.now() + Math.random();
             this.toasts.push({ id, message, level, show: true, progress: 100, undoEvent, undoData });
             
             let duration = 6000; // slightly longer for undo messages
             let interval = 30;
             let startTime = Date.now();
             let timer = setInterval(() => {
                 let elapsed = Date.now() - startTime;
                 let toast = this.toasts.find(t => t.id === id);
                 if (toast) {
                     toast.progress = Math.max(0, 100 - (elapsed / duration) * 100);
                     if (toast.progress <= 0) {
                         clearInterval(timer);
                         toast.show = false;
                         setTimeout(() => {
                             this.toasts = this.toasts.filter(t => t.id !== id);
                         }, 500);
                     }
                 } else {
                     clearInterval(timer);
                 }
             }, interval);
         }
     }"
     @show-toast.window="addToast($event.detail.message, $event.detail.level, $event.detail.undoEvent, $event.detail.undoData)"
     x-init="
         {% for message in messages %}
         addToast('{{ message|escapejs }}', '{% if message.level_tag == 'success' %}success{% elif message.level_tag == 'error' %}error{% elif message.level_tag == 'warning' %}warning{% else %}info{% endif %}');
         {% endfor %}
     "
     class="fixed z-50 flex flex-col gap-3 pointer-events-none" 
     style="direction: rtl; top: 1.5rem; left: 1.5rem;">
     
     <!-- Dynamic toasts loop -->
     <template x-for="toast in toasts" :key="toast.id">
         <div
             x-show="toast.show"
             x-transition:enter="transition ease-out duration-500"
             x-transition:enter-start="opacity-0 -translate-y-4"
             x-transition:enter-end="opacity-100 translate-y-0"
             x-transition:leave="transition ease-in duration-200"
             x-transition:leave-start="opacity-100"
             x-transition:leave-end="opacity-0"
             class="django-msg-toast flex items-center gap-3 pointer-events-auto"
             :data-level="toast.level"
             role="status"
         >
             <!-- Dismiss button on left side (RTL) -->
             <button
                 @click="toast.show = false"
                 class="flex-shrink-0 p-1.5 rounded-lg transition-colors duration-200 cursor-pointer"
                 style="color: currentColor; opacity: 0.6;"
                 onmouseover="this.style.opacity='1'; this.style.backgroundColor='rgba(0,0,0,0.05)'"
                 onmouseout="this.style.opacity='0.6'; this.style.backgroundColor='transparent'"
                 aria-label="إغلاق الرسالة"
             >
                 <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                     <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                 </svg>
             </button>

             <!-- Undo Button if event exists -->
             <template x-if="toast.undoEvent">
                 <button
                     @click="$dispatch(toast.undoEvent, toast.undoData); toast.show = false"
                     class="px-2.5 py-1 text-xs font-semibold rounded-lg cursor-pointer transition-all duration-200 flex-shrink-0"
                     style="background-color: var(--primary); color: #ffffff; border: none; font-family: 'Alexandria', sans-serif; margin-left: 4px;"
                     onmouseover="this.style.filter='brightness(1.15)'"
                     onmouseout="this.style.filter='none'"
                 >
                     تراجع
                 </button>
             </template>

             <!-- Message text -->
             <span class="flex-1 text-sm font-medium" style="color: var(--text-primary); font-family: 'Alexandria', sans-serif;" x-text="toast.message"></span>

             <!-- Message icon -->
             <div class="flex-shrink-0" style="color: currentColor;">
                 <svg x-show="toast.level === 'success'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                     <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                 </svg>
                 <svg x-show="toast.level === 'error'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                     <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4v.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                 </svg>
                 <svg x-show="toast.level === 'warning'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                     <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4v2m0 4v.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                 </svg>
                 <svg x-show="toast.level === 'info'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                     <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                 </svg>
             </div>

             <!-- Progress Bar -->
             <div class="absolute bottom-0 right-0 h-1 transition-all duration-75 ease-linear"
                  :style="{ width: toast.progress + '%', backgroundColor: 'currentColor' }"
                  style="opacity: 0.25;"></div>
         </div>
     </template>
</div>
