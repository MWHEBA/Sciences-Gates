<header class="header">
    <div class="container header__inner">
        <a href="/" class="header__logo">
            <svg class="header__logo-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 3L1 9L12 15L21 10.09V17H23V9M5 13.18V17.18L12 21L19 17.18V13.18L12 17L5 13.18Z"/>
            </svg>
            بوابات العلوم
        </a>

        <button class="header__hamburger" aria-label="القائمة الرئيسية">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="header__nav">
            <ul class="nav__list">
                <li><a href="/" class="nav__link {% if request.path == '/' %}active{% endif %}">الرئيسية</a></li>
                <li><a href="{% url 'universities:list' %}" class="nav__link {% if 'universities' in request.path %}active{% endif %}">الجامعات</a></li>
                <li><a href="{% url 'institutes:list' %}" class="nav__link {% if 'institutes' in request.path %}active{% endif %}">المعاهد</a></li>
                <li><a href="{% url 'majors:list' %}" class="nav__link {% if 'majors' in request.path %}active{% endif %}">التخصصات</a></li>
                <li><a href="{% url 'articles:list' %}" class="nav__link {% if 'articles' in request.path %}active{% endif %}">المقالات والأخبار</a></li>
                <li><a href="{% url 'leads:submit' %}" class="nav__link {% if 'contact' in request.path %}active{% endif %}">تواصل معنا</a></li>
            </ul>

            <div class="header__actions">
                <a href="{% url 'search:results' %}" class="btn btn--outline" aria-label="بحث">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </a>
                <a href="{% url 'leads:submit' %}" class="btn btn--primary">طلب تسجيل</a>
            </div>
        </nav>
    </div>
</header>
<!-- Spacer to prevent content from jumping under fixed header -->
<div style="height: 80px;"></div>
