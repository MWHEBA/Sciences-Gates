{% load static %}
<!-- Header Component with Navigation and Search -->
<!-- رأس الصفحة مع التنقل والبحث -->
<header class="bg-white border-b border-gray-200 sticky top-0 z-50" x-data="{ mobileMenuOpen: false }">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16">
            
            <!-- Logo/Brand -->
            <div class="flex-shrink-0">
                <a href="{% url 'home' %}" class="flex items-center space-x-2 rtl:space-x-reverse">
                    <img src="{% static 'images/logo.png' %}" alt="Science Gates" 
                         style="height: 40px; object-fit: contain;">
                </a>
            </div>

            <!-- Desktop Navigation Menu -->
            <nav class="hidden md:flex items-center space-x-1 rtl:space-x-reverse">
                <a 
                    href="{% url 'home' %}" 
                    class="px-3 py-2 rounded-md text-sm font-normal text-gray-700 hover:text-blue-600 hover:bg-gray-50 transition-colors"
                >
                    الرئيسية
                </a>
                <a 
                    href="{% url 'universities:list' %}" 
                    class="px-3 py-2 rounded-md text-sm font-normal text-gray-700 hover:text-blue-600 hover:bg-gray-50 transition-colors"
                >
                    الجامعات
                </a>
                <a 
                    href="{% url 'institutes:list' %}" 
                    class="px-3 py-2 rounded-md text-sm font-normal text-gray-700 hover:text-blue-600 hover:bg-gray-50 transition-colors"
                >
                    المعاهد
                </a>
                <a 
                    href="{% url 'majors:list' %}" 
                    class="px-3 py-2 rounded-md text-sm font-normal text-gray-700 hover:text-blue-600 hover:bg-gray-50 transition-colors"
                >
                    التخصصات
                </a>
                <a 
                    href="{% url 'articles:list' %}" 
                    class="px-3 py-2 rounded-md text-sm font-normal text-gray-700 hover:text-blue-600 hover:bg-gray-50 transition-colors"
                >
                    المقالات
                </a>
            </nav>

            <!-- Search and Mobile Menu Toggle -->
            <div class="flex items-center space-x-4 rtl:space-x-reverse">
                
                <!-- Search Form (Desktop) -->
                <form 
                    action="{% url 'search:results' %}" 
                    method="get" 
                    class="hidden lg:flex items-center"
                >
                    <div class="relative">
                        <input 
                            type="text" 
                            name="query" 
                            placeholder="ابحث عن جامعة أو تخصص..."
                            class="px-4 py-2 pr-10 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm"
                            dir="rtl"
                        >
                        <button 
                            type="submit" 
                            class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600"
                            aria-label="بحث"
                        >
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                            </svg>
                        </button>
                    </div>
                </form>

                <!-- Mobile Menu Toggle Button -->
                <button 
                    @click="mobileMenuOpen = !mobileMenuOpen"
                    class="md:hidden inline-flex items-center justify-center p-2 rounded-md text-gray-700 hover:text-blue-600 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-blue-500"
                    :aria-expanded="mobileMenuOpen"
                    aria-label="فتح القائمة"
                >
                    <svg 
                        x-show="!mobileMenuOpen"
                        class="block h-6 w-6" 
                        xmlns="http://www.w3.org/2000/svg" 
                        fill="none" 
                        viewBox="0 0 24 24" 
                        stroke="currentColor"
                    >
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                    <svg 
                        x-show="mobileMenuOpen"
                        class="block h-6 w-6" 
                        xmlns="http://www.w3.org/2000/svg" 
                        fill="none" 
                        viewBox="0 0 24 24" 
                        stroke="currentColor"
                    >
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- Mobile Navigation Menu -->
        <div 
            x-show="mobileMenuOpen"
            x-transition
            class="md:hidden border-t border-gray-200"
        >
            <div class="px-2 pt-2 pb-3 space-y-1">
                
                <!-- Mobile Search Form -->
                <form 
                    action="{% url 'search:results' %}" 
                    method="get" 
                    class="px-2 py-2"
                >
                    <div class="relative">
                        <input 
                            type="text" 
                            name="query" 
                            placeholder="ابحث..."
                            class="w-full px-4 py-2 pr-10 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm"
                            dir="rtl"
                        >
                        <button 
                            type="submit" 
                            class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600"
                            aria-label="بحث"
                        >
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                            </svg>
                        </button>
                    </div>
                </form>

                <!-- Mobile Navigation Links -->
                <a 
                    href="{% url 'home' %}" 
                    class="block px-3 py-2 rounded-md text-base font-normal text-gray-700 hover:text-blue-600 hover:bg-gray-50 transition-colors"
                    @click="mobileMenuOpen = false"
                >
                    الرئيسية
                </a>
                <a 
                    href="{% url 'universities:list' %}" 
                    class="block px-3 py-2 rounded-md text-base font-normal text-gray-700 hover:text-blue-600 hover:bg-gray-50 transition-colors"
                    @click="mobileMenuOpen = false"
                >
                    الجامعات
                </a>
                <a 
                    href="{% url 'institutes:list' %}" 
                    class="block px-3 py-2 rounded-md text-base font-normal text-gray-700 hover:text-blue-600 hover:bg-gray-50 transition-colors"
                    @click="mobileMenuOpen = false"
                >
                    المعاهد
                </a>
                <a 
                    href="{% url 'majors:list' %}" 
                    class="block px-3 py-2 rounded-md text-base font-normal text-gray-700 hover:text-blue-600 hover:bg-gray-50 transition-colors"
                    @click="mobileMenuOpen = false"
                >
                    التخصصات
                </a>
                <a 
                    href="{% url 'articles:list' %}" 
                    class="block px-3 py-2 rounded-md text-base font-normal text-gray-700 hover:text-blue-600 hover:bg-gray-50 transition-colors"
                    @click="mobileMenuOpen = false"
                >
                    المقالات
                </a>
            </div>
        </div>
    </div>
</header>
