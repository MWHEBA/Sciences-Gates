{% load static %}
<div class="pro-editor-mount"
     id="editor-mount-{{ widget.attrs.id }}"
     data-field-name="{{ widget.name }}">
    <textarea
        name="{{ widget.name }}"
        data-name="{{ widget.name }}"
        data-is-initial="true"
        class="inl-s-93b8ea5b2f"
        aria-hidden="true"
    >{{ widget.value|default:'' }}</textarea>
</div>
