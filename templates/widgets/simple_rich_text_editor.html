<div class="simple-rich-text-widget">
    <div class="rich-text-toolbar"></div>
    <div 
        class="rich-text-content"
        id="{{ widget.attrs.id }}"
        {% for name, value in widget.attrs.items %}
            {% if value is not False %}
                {% if value is True %}
                    {{ name }}
                {% else %}
                    {{ name }}="{{ value }}"
                {% endif %}
            {% endif %}
        {% endfor %}
    >{{ widget.value|default:"" }}</div>
    <textarea 
        name="{{ widget.name }}"
        {% for name, value in widget.attrs.items %}
            {% if value is not False %}
                {% if value is True %}
                    {{ name }}
                {% else %}
                    {{ name }}="{{ value }}"
                {% endif %}
            {% endif %}
        {% endfor %}
        style="display: none;"
    >{{ widget.value|default:"" }}</textarea>
</div>
