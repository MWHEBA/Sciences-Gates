<article class="card cursor-pointer" id="inl-el-c6d79f6edc">
    <!-- صورة الجامعة -->
    <a href="{% url 'universities:detail' university.slug %}" class="card__image block relative overflow-hidden h-52">
        <span class="card__badge absolute top-4 right-4 bg-white/95 text-secondary border border-border px-3 py-1 rounded text-xs font-semibold backdrop-blur-sm z-10">{{ university.get_university_type_display }}</span>
        <img 
            src="{% if university.main_image %}{{ university.main_image.url }}{% else %}https://images.unsplash.com/photo-1562774053-701939374585?auto=format&fit=crop&q=80&w=800{% endif %}" 
            alt="{{ university.name }}"
            loading="lazy"
            class="w-full h-full object-cover transition-transform duration-500 hover:scale-105"
        >
    </a>
    
    <!-- محتوى الكرت -->
    <div class="card__content p-6 flex flex-col flex-grow">
        <!-- اسم الجامعة -->
        <h3 class="card__title text-lg font-bold mb-3 text-text-primary">
            <a href="{% url 'universities:detail' university.slug %}" class="hover:text-secondary transition-colors">{{ university.name }}</a>
        </h3>
        
        <!-- الوصف -->
        <p class="card__desc text-text-secondary text-sm leading-relaxed mb-6 flex-grow">{{ university.description|striptags|truncatewords:20 }}</p>
        
        <!-- التذييل -->
        <div class="card__footer pt-4 border-t border-border flex items-center justify-between text-text-muted text-xs">
            <span class="flex items-center gap-1.5 text-text-secondary">
                <svg class="w-4 h-4 text-secondary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                    <circle cx="12" cy="10" r="3"></circle>
                </svg>
                <span>{{ university.location|striptags|truncatewords:3 }}</span>
            </span>
            <a href="{% url 'universities:detail' university.slug %}" class="flex items-center gap-1 text-primary font-bold hover:text-secondary transition-colors">
                <span>اقرأ المزيد</span>
                <svg class="w-4 h-4 transform rotate-180" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M5 12h14M12 5l7 7-7 7"></path>
                </svg>
            </a>
        </div>
    </div>
</article>
