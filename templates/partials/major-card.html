{% load major_tags %}
<article class="card card--horizontal" onclick="window.location.href='{% url 'majors:detail' major.slug %}'">
    <!-- صورة التخصص -->
    <div class="card__image">
        <img 
            src="{% if major.image %}{{ major.image.url }}{% else %}https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&q=80&w=800{% endif %}" 
            alt="{{ major.name }}"
            loading="lazy"
        >
    </div>
    
    <!-- محتوى الكرت -->
    <div class="card__content">
        <!-- اسم التخصص -->
        <h3 class="card__title">
            <a href="{% url 'majors:detail' major.slug %}" onclick="event.stopPropagation();">{{ major.name }}</a>
        </h3>
        
        <!-- الوصف -->
        <p class="card__desc">{{ major.description|clean_desc|truncatewords:15 }}</p>
        
        <!-- زر التفاصيل -->
        <div class="card__actions">
            <a 
                href="{% url 'majors:detail' major.slug %}" 
                class="btn btn--outline btn--sm"
                onclick="event.stopPropagation();"
            >
                التفاصيل والجامعات
            </a>
        </div>
    </div>
</article>
