<div class="empty-state">
    <svg class="empty-state__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <h3 class="empty-state__title">{{ title|default:"لا توجد نتائج مطابقة" }}</h3>
    <p class="empty-state__message">{{ message|default:"يبدو أنه لا توجد عناصر تطابق معايير البحث الحالية. حاول تغيير الكلمات المفتاحية أو التصنيفات." }}</p>
    <a href="{{ clear_url|default:"/" }}" class="btn btn--primary">مسح عوامل التصفية</a>
</div>
