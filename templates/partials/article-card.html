{% load static %}
<article class="it-course-item cursor-pointer">
    <!-- صورة المقال -->
    <div class="it-course-thumb mb-4 p-relative">
        <a href="{{ article.get_absolute_url }}">
            <img src="{% if article.featured_image %}{{ article.featured_image.url }}{% else %}https://images.unsplash.com/photo-1523050854058-8df90110c9f1?auto=format&fit=crop&q=80&w=800{% endif %}" alt="{{ article.title }}" loading="lazy">
        </a>
        {% if article.category %}
        <div class="it-course-thumb-text">
            <span>{{ article.category.name }}</span>
        </div>
        {% endif %}
    </div>
    
    <!-- محتوى الكرت -->
    <div class="it-course-content">
        <!-- عنوان المقال -->
        <h4 class="it-course-title">
            <a href="{{ article.get_absolute_url }}">{{ article.title }}</a>
        </h4>
        
        <!-- وصف مختصر -->
        <p class="card__desc text-text-secondary text-sm leading-relaxed mb-15 flex-grow" style="font-size: 0.875rem; color: var(--text-body); line-height: 1.6; margin-bottom: 15px;">
            {{ article.excerpt|truncatewords:15 }}
        </p>
        
        <!-- معلومات المقال -->
        <div class="it-course-info">
            <span>
                <i class="fa-solid fa-calendar-days ml-2 text-secondary"></i>
                {{ article.published_date|date:"d F Y" }}
            </span>
            <span>
                <i class="fa-solid fa-user ml-2 text-secondary"></i>
                {{ article.author.get_full_name|default:article.author.username }}
            </span>
        </div>
        
        <!-- رابط قراءة المقال -->
        <div class="it-course-price-box">
            <span style="font-size: 0.9rem; font-weight: 500; color: var(--text-body);">
                بوابات العلوم للأخبار
            </span>
            <a href="{{ article.get_absolute_url }}">
                <span>اقرأ المقال</span>
                <i class="fa-solid fa-arrow-left mr-2"></i>
            </a>
        </div>
    </div>
</article>
