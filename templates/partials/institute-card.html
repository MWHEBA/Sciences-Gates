{% load static institute_tags %}
<article class="it-course-item cursor-pointer" onclick="window.location.href='{{ institute.get_absolute_url }}'">
    <!-- صورة المعهد -->
    <div class="it-course-thumb mb-4 p-relative">
        <a href="{{ institute.get_absolute_url }}" onclick="event.stopPropagation();">
            <img src="{% if institute.main_image %}{{ institute.main_image.url }}{% else %}https://images.unsplash.com/photo-1577896851231-70ef18881754?auto=format&fit=crop&q=80&w=800{% endif %}" alt="{{ institute.main_image_alt|default:institute.name }}" loading="lazy">
        </a>
        <div class="it-course-thumb-text">
            <span>معهد</span>
        </div>
    </div>
    
    <!-- محتوى الكرت -->
    <div class="it-course-content">
        <!-- اسم المعهد -->
        <h4 class="it-course-title">
            <a href="{{ institute.get_absolute_url }}" onclick="event.stopPropagation();">{{ institute.name }}</a>
        </h4>
        
        <!-- وصف مختصر -->
        <p class="card__desc text-text-secondary text-sm leading-relaxed mb-15 flex-grow" style="font-size: 0.875rem; color: var(--text-body); line-height: 1.6; margin-bottom: 15px;">
            {{ institute.description|clean_desc|truncatewords:15 }}
        </p>
        
        <!-- معلومات المعهد -->
        <div class="it-course-info">
            <span>
                <i class="fa-solid fa-location-dot ml-2 text-secondary"></i>
                {{ institute.get_location_display }}
            </span>
            <span>
                <i class="fa-solid fa-book-open ml-2 text-secondary"></i>
                {{ institute.courses.count }} دورات
            </span>
        </div>
        
        <!-- رسوم التسجيل ورابط التفاصيل -->
        <div class="it-course-price-box">
            <span style="font-size: 0.9rem; font-weight: 500; color: var(--text-body);">
                الرسوم تبدأ من: 
                <strong style="color: var(--secondary); font-weight: 700;">{{ institute.avg_cost|default:"تواصل معنا" }}</strong>
            </span>
            <a href="{{ institute.get_absolute_url }}" onclick="event.stopPropagation();">
                <span>اقرأ المزيد</span>
                <i class="fa-solid fa-arrow-left mr-2"></i>
            </a>
        </div>
    </div>
</article>
