{% load institute_tags %}
<article class="card card--horizontal" onclick="window.location.href='{{ institute.get_absolute_url }}'">
    <!-- صورة المعهد -->
    <div class="card__image">
        <span class="card__badge">معهد</span>
        <img 
            src="{% if institute.main_image %}{{ institute.main_image.url }}{% else %}https://images.unsplash.com/photo-1577896851231-70ef18881754?auto=format&fit=crop&q=80&w=800{% endif %}" 
            alt="{{ institute.name }}"
            loading="lazy"
        >
    </div>
    
    <!-- محتوى الكرت -->
    <div class="card__content">
        <!-- اسم المعهد -->
        <h3 class="card__title">
            <a href="{{ institute.get_absolute_url }}" onclick="event.stopPropagation();">{{ institute.name }}</a>
        </h3>
        
        <!-- الوصف -->
        <p class="card__desc">{{ institute.description|clean_desc|truncatewords:20 }}</p>
        
        <!-- التذييل -->
        <div class="card__footer" onclick="event.stopPropagation();">
            <span>
                <i class="fa-solid fa-location-dot"></i>
                <span>{{ institute.location|clean_desc|truncatewords:3 }}</span>
            </span>
            <a href="{{ institute.get_absolute_url }}" class="card__link">
                <span>استعرض البرامج</span>
                <i class="fa-solid fa-arrow-left"></i>
            </a>
        </div>
    </div>
</article>
