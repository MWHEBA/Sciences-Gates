<article class="card" class="inl-s-58aba5753b" id="inl-el-323644610e">
    <!-- صورة المعهد -->
    <a href="{% url 'institutes:detail' institute.slug %}" class="card__image">
        <span class="card__badge">معهد</span>
        <img 
            src="{% if institute.main_image %}{{ institute.main_image.url }}{% else %}https://images.unsplash.com/photo-1577896851231-70ef18881754?auto=format&fit=crop&q=80&w=800{% endif %}" 
            alt="{{ institute.name }}"
            loading="lazy"
        >
    </a>
    
    <!-- محتوى الكرت -->
    <div class="card__content">
        <!-- اسم المعهد -->
        <h3 class="card__title">
            <a href="{% url 'institutes:detail' institute.slug %}">{{ institute.name }}</a>
        </h3>
        
        <!-- الوصف -->
        <p class="card__desc">{{ institute.description|striptags|truncatewords:20 }}</p>
        
        <!-- التذييل -->
        <div class="card__footer">
            <span class="inl-s-b74e94faa3">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                    <circle cx="12" cy="10" r="3"></circle>
                </svg>
                <span>{{ institute.location|truncatewords:3 }}</span>
            </span>
            <a href="{% url 'institutes:detail' institute.slug %}" class="inl-s-0ba4dac58a" id="inl-el-437eeae055">
                استعرض البرامج
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="inl-s-8657ef20e4" aria-hidden="true">
                    <path d="M5 12h14M12 5l7 7-7 7"></path>
                </svg>
            </a>
        </div>
    </div>
</article>
